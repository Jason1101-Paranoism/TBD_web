      const [sandboxLine, setSandboxLine] = useState('校園社群工具開發');
      const [sandboxPain, setSandboxPain] = useState('高一新生選課系統繁雜，新生難以快速找到合適學長姐問課');
      const [sandboxAction, setSandboxAction] = useState('利用 React 與 Firebase 自學架設「問課導師媒合平台」');

      const handleAiPolish = async () => {
        if (!sandboxPain || !sandboxAction || !sandboxResult) {
          triggerToast("請先填寫痛點、行動與成果，AI 才有素材發揮魔法喔！");
          return;
        }

        setIsAiGenerating(true);
        setAiPolishedText('');

        const prompt = `你是一位曾任教於台灣頂尖大學的教授，同時也是專業的升學顧問。現在有一位高中生想要建立他的個人網站 (Portfolio)，他填寫了以下草稿，但內容較為生硬散亂。

        學生姓名：${sandboxName}
        個人主線：${sandboxLine}
        遭遇的痛點(Situation)：${sandboxPain}
        採取的行動(Action)：${sandboxAction}
        具體的成果(Result)：${sandboxResult}

        請幫他利用 STAR 原則，將這些草稿「重新淬鍊、潤飾」成一段約 200-300 字的專業經歷敘述。
        要求：
        1. 採用第一人稱「我」。
        2. 語氣要自信、具備學術探究精神與動手做的熱忱，但切忌使用過度浮誇、老氣或 AI 味很重的官腔用詞。
        3. 敘事結構要緊湊，凸顯「痛點」到「解決方案」的邏輯。
        4. 適度使用 Markdown 條列式或粗體讓版面易讀。
        5. 直接輸出潤飾後的文案，不要有任何前言或問候語。`;

        const apiKey = ""; // Runtime Environment Will Inject
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        let delay = 1000;
        const maxRetries = 5;

        for (let i = 0; i < maxRetries; i++) {
          try {
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }]
              })
            });

            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

            const data = await response.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            
            if (text) {
              setAiPolishedText(text);
              triggerToast("✨ AI 淬鍊完成！");
              break;
            } else {
              throw new Error("No text generated");
            }
          } catch (error) {
            console.error("Gemini API Error:", error);
            if (i === maxRetries - 1) {
              triggerToast("⚠️ AI 生成失敗，請稍後再試。");
            } else {
              await new Promise(resolve => setTimeout(resolve, delay));
              delay *= 2;
            }
          }
        }
        setIsAiGenerating(false);
      };

        setToastMessage(msg);
        setShowToast(true);
        setTimeout(() => {

        document.body.appendChild(el);
