<section class="portfolio-guide-page bg-[#F8FAFC] min-h-screen">
  <div id="portfolioGuideRoot"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    const LINE_URL = "https://lin.ee/9ciZvbA";

    const Icons = {
      ArrowRight: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      ),
      Check: () => (
        <svg className="w-5 h-5 text-emerald-500 shrink-0" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      ),
      X: () => (
        <svg className="w-5 h-5 text-rose-500 shrink-0" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      ),
      Copy: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3" />
        </svg>
      )
    };

    function PortfolioGuideApp() {
      const [currentTab, setCurrentTab] = useState("home");
      const [mockupTab, setMockupTab] = useState("projects");
      const [openFaq, setOpenFaq] = useState(null);
      const [toast, setToast] = useState("");

      const [sandboxName, setSandboxName] = useState("林大為");
      const [sandboxLine, setSandboxLine] = useState("校園社群工具開發");
      const [sandboxPain, setSandboxPain] = useState("高一新生選課系統繁雜，新生難以快速找到合適學長姐問課");
      const [sandboxAction, setSandboxAction] = useState("利用 React 與 Firebase 自學架設「問課導師媒合平台」");
      const [sandboxResult, setSandboxResult] = useState("上線 2 週內吸引全校 450+ 位學生註冊，促成 120 次有效諮詢");
      const [generatedPrompt, setGeneratedPrompt] = useState("");

      const navItems = [
        { id: "home", label: "首頁" },
        { id: "concept", label: "Portfolio 是什麼" },
        { id: "step", label: "從 0 開始建立" },
        { id: "templates", label: "架構模板" },
        { id: "tools", label: "工具指南" },
        { id: "cases", label: "真實案例" },
        { id: "mistakes", label: "常見錯誤" },
        { id: "resources", label: "精選 Portfolio 資源" },
        { id: "faq", label: "FAQ" }
      ];

      const showToast = (message) => {
        setToast(message);
        window.setTimeout(() => setToast(""), 2600);
      };

      const copyText = async (text, message = "已複製！") => {
        try {
          await navigator.clipboard.writeText(text);
          showToast(message);
        } catch (err) {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          document.body.removeChild(textarea);
          showToast(message);
        }
      };

      const handleTabChange = (id) => {
        setCurrentTab(id);
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const handleGeneratePrompt = () => {
        if (!sandboxPain || !sandboxAction || !sandboxResult) {
          showToast("請先填寫痛點、行動與成果。");
          return;
        }

        const prompt = `你是一位專業升學顧問與大學面試教練。請根據以下學生素材，將內容潤飾成一段可放入高中生 Portfolio 個人網站的專業經歷敘述。

學生姓名：${sandboxName || "學生"}
個人主線：${sandboxLine || "尚未填寫"}
遭遇的痛點 Situation：${sandboxPain}
採取的行動 Action：${sandboxAction}
具體成果 Result：${sandboxResult}

請依照 STAR / SARI 敘事邏輯重寫：
1. 使用第一人稱「我」。
2. 字數約 200–300 字。
3. 語氣自信、真實、有高中生自主學習感。
4. 避免過度浮誇、官腔、AI 味。
5. 凸顯「問題意識 → 行動方法 → 成果證據 → 反思成長」。
6. 可使用簡短段落或條列。
7. 不要輸出前言，不要說「以下是」。`;

        setGeneratedPrompt(prompt);
        showToast("Prompt 已產生，可以複製使用。");
      };

      return (
        <div className="text-[#142143]">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 lg:py-14">
            <div className="grid lg:grid-cols-[260px_1fr] gap-8 items-start">
              <aside className="lg:sticky lg:top-24">
                <div className="rounded-2xl border border-[#D0CEDB]/70 bg-white/90 shadow-soft p-4">
                  <div className="px-3 pb-3 border-b border-[#D0CEDB]/50">
                    <p className="text-[11px] font-extrabold text-[#1A5D94] tracking-widest uppercase">Guide Menu</p>
                    <h2 className="mt-1 text-lg font-extrabold text-[#142143]">Portfolio 指南</h2>
                  </div>
                  <nav className="mt-3 space-y-1">
                    {navItems.map((item) => (
                      <button
                        key={item.id}
                        type="button"
                        onClick={() => handleTabChange(item.id)}
                        className={`w-full text-left rounded-xl px-3 py-2.5 text-sm font-bold transition ${
                          currentTab === item.id
                            ? "bg-[#1A5D94] text-white shadow-soft"
                            : "text-[#767995] hover:bg-[#D0CEDB]/25 hover:text-[#142143]"
                        }`}
                      >
                        {item.label}
                      </button>
                    ))}
                  </nav>
                </div>
              </aside>

              <main className="space-y-10">
                {currentTab === "home" && renderHome()}
                {currentTab === "concept" && renderConcept()}
                {currentTab === "step" && renderSteps()}
                {currentTab === "templates" && renderTemplates()}
                {currentTab === "tools" && renderTools()}
                {currentTab === "cases" && renderCases()}
                {currentTab === "mistakes" && renderMistakes()}
                {currentTab === "resources" && renderResources()}
                {currentTab === "faq" && renderFaq()}
              </main>
            </div>

            {renderBottomCta()}
          </div>

          {toast && (
            <div className="fixed bottom-5 right-5 z-[70] rounded-xl bg-[#142143] text-white px-5 py-3 shadow-2xl text-sm font-bold">
              {toast}
            </div>
          )}
        </div>
      );

      function SectionHeader({ kicker, title, children }) {
        return (
          <div className="space-y-3">
            <span className="inline-flex items-center rounded-full bg-[#1A5D94]/10 text-[#1A5D94] px-3 py-1 text-xs font-extrabold">
              {kicker}
            </span>
            <h1 className="text-3xl sm:text-4xl font-extrabold tracking-tight text-[#142143] leading-tight">
              {title}
            </h1>
            {children && <p className="text-[#767995] leading-relaxed max-w-3xl">{children}</p>}
          </div>
        );
      }

      function renderHome() {
        return (
          <div className="space-y-10">
            <section className="grid lg:grid-cols-12 gap-8 items-center">
              <div className="lg:col-span-7 space-y-6">
                <span className="inline-flex items-center rounded-full bg-[#1A5D94]/10 text-[#1A5D94] px-4 py-2 text-xs font-extrabold">
                  陪你從 0 到 1 打造升學主線
                </span>
                <h1 className="text-4xl sm:text-5xl lg:text-6xl font-extrabold leading-tight tracking-tight">
                  從 0 開始建立你的<br />
                  <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#1A5D94] via-[#142143] to-[#FAB748]">
                    高中生 Portfolio
                  </span>
                </h1>
                <p className="text-lg text-[#767995] leading-relaxed max-w-2xl">
                  不只是把資料放上網，而是把自主學習、專題成果與活動經歷整理成教授看得懂的個人主線。
                </p>

                <div className="grid sm:grid-cols-3 gap-4 pt-4 border-t border-[#D0CEDB]/60 max-w-2xl">
                  <Metric value="主線化" label="把散亂素材串成故事" />
                  <Metric value="可驗證" label="連結作品、紀錄與證據" />
                  <Metric value="可延伸" label="升學後仍能持續更新" />
                </div>
              </div>

              <div className="lg:col-span-5">
                <PortfolioMockup />
              </div>
            </section>

            <section className="grid md:grid-cols-3 gap-6">
              {[
                ["串接個人主線", "讓獎狀、專題、活動不再只是清單，而是變成能說明你為什麼適合某個學群的故事。"],
                ["建立真實證明力", "用 GitHub、影片、設計稿、實驗紀錄等證據，補上 PDF 備審容易缺少的可信度。"],
                ["形成長期資產", "個人網站可以一路延伸到大學、實習、研究與求職，是一份可以更新的數位履歷。"]
              ].map(([title, text]) => (
                <article key={title} className="bg-white border border-[#D0CEDB]/60 rounded-2xl p-6 shadow-soft">
                  <h3 className="text-lg font-extrabold text-[#142143]">{title}</h3>
                  <p className="mt-3 text-sm leading-relaxed text-[#767995]">{text}</p>
                </article>
              ))}
            </section>
          </div>
        );
      }

      function Metric({ value, label }) {
        return (
          <div>
            <p className="text-xl font-black text-[#1A5D94]">{value}</p>
            <p className="mt-1 text-xs text-[#767995]">{label}</p>
          </div>
        );
      }

      function PortfolioMockup() {
        return (
          <div className="bg-white rounded-2xl shadow-2xl border border-[#D0CEDB]/50 overflow-hidden">
            <div className="bg-[#142143] px-4 py-3 flex items-center justify-between">
              <div className="flex space-x-1.5">
                <div className="w-3 h-3 rounded-full bg-rose-500"></div>
                <div className="w-3 h-3 rounded-full bg-amber-400"></div>
                <div className="w-3 h-3 rounded-full bg-emerald-500"></div>
              </div>
              <div className="text-xs text-slate-400 font-mono">portfolio.tbd</div>
              <div className="w-6"></div>
            </div>

            <div className="p-6 space-y-5">
              <div className="flex items-center space-x-4">
                <div className="w-14 h-14 rounded-full bg-gradient-to-tr from-[#1A5D94] to-[#FAB748] flex items-center justify-center text-white text-xl font-black">
                  陳
                </div>
                <div>
                  <h3 className="text-lg font-extrabold text-[#142143]">陳元宏</h3>
                  <p className="text-xs text-[#767995] font-semibold">主線：低功耗邊緣運算與開源物聯網實踐</p>
                </div>
              </div>

              <div className="flex border-b border-[#D0CEDB]/40 text-xs font-mono">
                {["about", "projects", "skills"].map((tab) => (
                  <button
                    key={tab}
                    onClick={() => setMockupTab(tab)}
                    className={`pb-2 px-3 font-bold transition ${
                      mockupTab === tab ? "border-b-2 border-[#1A5D94] text-[#1A5D94]" : "text-[#767995]"
                    }`}
                  >
                    {tab === "about" ? "關於我" : tab === "projects" ? "代表專案" : "掌握工具"}
                  </button>
                ))}
              </div>

              <div className="min-h-[170px] bg-slate-50 p-4 rounded-xl border border-slate-100 text-sm">
                {mockupTab === "about" && (
                  <div className="space-y-2">
                    <p className="font-bold text-[#1A5D94]">「我深信最佳的學習在於親手將抽象邏輯落地實踐。」</p>
                    <p className="text-[#767995] text-xs leading-relaxed">
                      我在高中自主學習中專注於物聯網架構，嘗試以低成本硬體建立校園車流量辨識器。
                    </p>
                  </div>
                )}
                {mockupTab === "projects" && (
                  <div className="space-y-3">
                    <Project title="Edge-Traffic-Analyzer" tag="45+ Stars" text="串接 OpenCV 於 Raspberry Pi，建立校園車流追蹤系統。" />
                    <Project title="ESP32 微氣象監測節點" tag="IoT" text="每 5 分鐘回傳空氣品質資訊，並發布 LINE 警報。" />
                  </div>
                )}
                {mockupTab === "skills" && (
                  <div className="space-y-3">
                    <SkillGroup title="開發語言與框架" items={["Python", "C/C++", "OpenCV", "Git"]} />
                    <SkillGroup title="硬體與協議" items={["ESP32", "Raspberry Pi", "WiFi", "MQTT"]} />
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      function Project({ title, tag, text }) {
        return (
          <div className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
            <div className="flex justify-between gap-3">
              <span className="font-bold text-[#142143] text-xs">{title}</span>
              <span className="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-bold">{tag}</span>
            </div>
            <p className="text-[11px] text-[#767995] mt-1">{text}</p>
          </div>
        );
      }

      function SkillGroup({ title, items }) {
        return (
          <div>
            <span className="text-xs font-semibold text-[#142143]">{title}</span>
            <div className="flex flex-wrap gap-1.5 mt-1.5">
              {items.map((item) => (
                <span key={item} className="text-[10px] bg-[#1A5D94]/10 text-[#1A5D94] px-2 py-0.5 rounded font-mono font-bold">
                  {item}
                </span>
              ))}
            </div>
          </div>
        );
      }

      function renderConcept() {
        return (
          <div className="space-y-8">
            <SectionHeader kicker="基礎概念" title="Portfolio 是什麼？">
              Portfolio 是能展現能力亮點與探索軌跡的動態作品集。它不是取代備審 PDF，而是補上 PDF 最難呈現的互動、證據與長期更新能力。
            </SectionHeader>

            <div className="bg-white rounded-2xl border border-[#D0CEDB]/60 overflow-hidden shadow-soft">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm min-w-[760px]">
                  <thead className="bg-[#D0CEDB]/35 text-[#142143]">
                    <tr>
                      <th className="p-4 font-extrabold">比較維度</th>
                      <th className="p-4 font-extrabold text-[#1A5D94]">個人 Portfolio 網站</th>
                      <th className="p-4 font-extrabold text-[#767995]">傳統備審 PDF</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-[#D0CEDB]/40">
                    {[
                      ["排版自由度", "可用卡片、動線、互動與多媒體呈現個人主線。", "受格式限制，容易變成文字與證明堆疊。"],
                      ["證據呈現", "可連結 GitHub、影片、設計稿、Demo 與數據。", "多數只能放截圖與簡短說明。"],
                      ["長期價值", "可持續更新到大學、實習、研究與求職。", "常在申請結束後失去用途。"],
                      ["核心目的", "說清楚你如何學習、行動、反思與累積。", "多半偏向合規上傳與成果羅列。"]
                    ].map((row) => (
                      <tr key={row[0]}>
                        <td className="p-4 font-bold text-[#142143]">{row[0]}</td>
                        <td className="p-4 text-[#1A5D94] font-semibold">{row[1]}</td>
                        <td className="p-4 text-[#767995]">{row[2]}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
      }

      function renderSteps() {
        const steps = [
          ["整理素材池", "先列出高中階段所有活動、專題、競賽、報告與自學紀錄。"],
          ["萃取個人主線", "從經歷交集找出你真正持續關心的問題與學習方向。"],
          ["撰寫 About Me", "用信念、實踐亮點、未來方向建立第一印象。"],
          ["拆解 Projects", "用 STAR / SARI 說明情境、行動、成果與反思。"],
          ["整理 Skills", "避免百分比能力條，改用代表作證明能力。"],
          ["選擇工具部署", "依照能力與時間選 Notion、Carrd、GitHub Pages 或 Vercel。"],
          ["測試與迭代", "請老師、同學、家長試看，確認 3 分鐘內能看懂你的主線。"]
        ];
        return (
          <div className="space-y-8">
            <SectionHeader kicker="Step by Step" title="從 0 開始建立 Portfolio">
              先不要急著選工具。最重要的是先把素材整理成主線，再決定用什麼形式呈現。
            </SectionHeader>
            <div className="grid gap-4">
              {steps.map(([title, text], index) => (
                <article key={title} className="bg-white border border-[#D0CEDB]/60 rounded-2xl p-5 shadow-soft grid sm:grid-cols-[80px_1fr] gap-4">
                  <div className="text-[#1A5D94] font-black text-xl">0{index + 1}</div>
                  <div>
                    <h3 className="font-extrabold text-[#142143]">{title}</h3>
                    <p className="mt-2 text-sm leading-relaxed text-[#767995]">{text}</p>
                  </div>
                </article>
              ))}
            </div>
          </div>
        );
      }

      function renderTemplates() {
        const blocks = [
          ["Hero 首屏", "姓名、主線、目標學群、最關鍵的一句話。"],
          ["About Me", "不是自傳流水帳，而是你如何形成目前方向。"],
          ["Projects", "每個專案都要有問題、方法、成果、反思。"],
          ["Evidence", "放可驗證的連結：影片、程式碼、簡報、報告。"],
          ["Reflection", "說明失敗、修正、下一步，而不只是成果展示。"]
        ];
        return (
          <div className="space-y-8">
            <SectionHeader kicker="Structure" title="推薦架構模板">
              一份好的 Portfolio 不需要頁面很多，但每個區塊都要對應到教授想確認的能力。
            </SectionHeader>
            <div className="grid md:grid-cols-2 gap-5">
              {blocks.map(([title, text]) => (
                <article key={title} className="bg-white border border-[#D0CEDB]/60 rounded-2xl p-6 shadow-soft">
                  <h3 className="font-extrabold text-[#142143]">{title}</h3>
                  <p className="mt-2 text-sm leading-relaxed text-[#767995]">{text}</p>
                </article>
              ))}
            </div>
            {renderPromptGenerator()}
          </div>
        );
      }

      function renderPromptGenerator() {
        return (
          <section className="bg-white border border-[#D0CEDB]/70 rounded-3xl p-6 sm:p-8 shadow-soft space-y-6">
            <div>
              <span className="inline-flex rounded-full bg-[#FAB748]/20 text-[#142143] px-3 py-1 text-xs font-extrabold">Prompt Generator</span>
              <h2 className="mt-3 text-2xl font-extrabold text-[#142143]">用 Prompt 把素材轉成 Portfolio 文案</h2>
              <p className="mt-2 text-sm text-[#767995] leading-relaxed">
                先不用串接 AI。填入自己的痛點、行動與成果，系統會幫你整理成可直接貼到 ChatGPT / Gemini / Claude 的高品質 Prompt。
              </p>
            </div>

            <div className="grid md:grid-cols-2 gap-4">
              <Input label="學生姓名" value={sandboxName} onChange={setSandboxName} />
              <Input label="個人主線" value={sandboxLine} onChange={setSandboxLine} />
              <Textarea label="遭遇的痛點 Situation" value={sandboxPain} onChange={setSandboxPain} />
              <Textarea label="採取的行動 Action" value={sandboxAction} onChange={setSandboxAction} />
              <Textarea label="具體成果 Result" value={sandboxResult} onChange={setSandboxResult} className="md:col-span-2" />
            </div>

            <button
              type="button"
              onClick={handleGeneratePrompt}
              className="inline-flex items-center justify-center gap-2 rounded-xl bg-[#1A5D94] px-6 py-3 text-sm font-extrabold text-white shadow-soft hover:bg-[#142143] transition"
            >
              產生 Prompt
              <Icons.ArrowRight />
            </button>

            {generatedPrompt && (
              <div className="bg-slate-50 border border-slate-200 rounded-2xl p-5 space-y-4">
                <div>
                  <h4 className="text-sm font-extrabold text-[#142143]">可複製使用的 Portfolio 潤飾 Prompt</h4>
                  <p className="mt-1 text-xs text-[#767995]">將以下內容貼到 ChatGPT、Gemini 或 Claude，即可產生第一版 Portfolio 文案。</p>
                </div>
                <pre className="whitespace-pre-wrap text-xs leading-relaxed text-[#142143] bg-white border border-slate-200 rounded-xl p-4 overflow-x-auto">
                  {generatedPrompt}
                </pre>
                <button
                  type="button"
                  onClick={() => copyText(generatedPrompt, "Prompt 已複製！")}
